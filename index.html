<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My To Do List</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="lace lace-top"></div>

<div class="container">

<header class="main-header">

<div class="sticker">MY DAILY LIST</div>

<h1>My To Do List</h1>

<p>Catat kegiatan kamu hari ini</p>

</header>


<main class="todo-card">

<div class="input-wrapper">

<input type="text" id="input-tugas" placeholder="Tambahkan to do list">

<button id="btn-tambah" class="btn-tambah">
tambah
</button>

</div>


<div class="list-container">

<ul id="daftar-tugas">
</ul>

<p id="pesan-kosong">
Belum ada tugas hari ini
</p>

</div>


<div class="counter">

<span>Total tugas:</span>

<strong id="jumlah-tugas">0</strong>

</div>

</main>

</div>


<div class="lace lace-bottom"></div>

<script src="app.js"></script>

</body>
</html>
