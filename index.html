<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
<div class="todo">

<h1>My To Do List 📋</h1>

<div class="row">
<input type="text" id="inputTask" placeholder="Tambahkan to do list">
<button id="tombol">tambah</button>
</div>

<ul id="listContainer"></ul>

<div class="stats">
<div>Total Tugas <strong id="total">0</strong></div>
<div>Selesai <strong id="selesai">0</strong></div>
<div>Belum Selesai <strong id="belum">0</strong></div>
</div>

</div>
</div>

<script src="app.js"></script>
</body>
</html>
